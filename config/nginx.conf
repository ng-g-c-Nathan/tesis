server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/Conqueror;
    index index.html;

    # Angular routing — todas las rutas caen al index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy a la API de Spring Boot.
    # Angular hardcodea http://localhost:8080/api — en producción
    # nginx intercepta /api/ y lo redirige al contenedor spring-vpn,
    # así no hay que recompilar el dist.
    location /api/ {
        proxy_pass http://spring-vpn:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Cache para assets estáticos
    location ~* \.(js|css|png|jpg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}