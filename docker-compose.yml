# ===================================================================
# docker-compose.yml — Orquestador principal del proyecto Tesis
# ===================================================================

services:

  repos:
    build:
      context: .
      dockerfile: Dockerfile.repos
    volumes:
      - tesis-repos:/tesis
    restart: "no"

  spring-vpn:
    build:
      context: .
      dockerfile: Dockerfile.spring-vpn
    container_name: spring-vpn
    restart: unless-stopped
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun
    ports:
      - "1194:1194/udp"
      - "8080:8080"
    volumes:
      - openvpn-pki:/etc/openvpn/pki
      - openvpn-logs:/var/openvpn/daily
      - traffic-daily:/app/daily
    environment:
      - TRAFFIC_DIR=/app/daily
      # 172.17.0.1 = IP del host desde dentro de Docker (gateway por defecto)
      # python-scorer usa network_mode: host, por eso no es alcanzable por nombre
      - PYTHON_API_URL=http://172.17.0.1:5000
      - SPRING_PROFILES_ACTIVE=prod
    sysctls:
      - net.ipv4.ip_forward=1
    depends_on:
      - python-scorer
    healthcheck:
      test: ["CMD", "sh", "-c", "cat /etc/openvpn/openvpn.pid | xargs -I{} test -d /proc/{}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  angular:
    build:
      context: .
      dockerfile: Dockerfile.angular
    container_name: angular
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - spring-vpn

  python-scorer:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: python-scorer
    restart: unless-stopped
    # network_mode: host — Scapy ve todo el tráfico real del host (eth0, tun0, etc.)
    # Spring lo alcanza via 172.17.0.1:5000 en lugar de por nombre de contenedor
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - traffic-daily:/app/daily
      - ml-models:/app/models
    environment:
      - DAILY_DIR=/app/daily

volumes:
  tesis-repos:
    driver: local
  openvpn-pki:
    driver: local
  openvpn-logs:
    driver: local
  traffic-daily:
    driver: local
  ml-models:
    driver: local