# ===================================================================
# server.conf — Configuración por defecto de OpenVPN (modo servidor)
# Plug & play: funciona sin tocar nada.
# Para personalizar, edita este archivo y reinicia el contenedor.
# ===================================================================

# --- Red VPN ---
# Subred que se asignará a los clientes conectados
server 10.8.0.0 255.255.0.0

# --- Protocolo y puerto ---
proto udp
port  1194

# --- Interfaz virtual ---
dev tun

# --- Certificados (generados automáticamente por entrypoint.sh) ---
ca   /etc/openvpn/pki/ca.crt
cert /etc/openvpn/pki/issued/server.crt
key  /etc/openvpn/pki/private/server.key
dh   /etc/openvpn/pki/dh.pem

# TLS auth: capa extra de autenticación (HMAC)
tls-auth /etc/openvpn/pki/ta.key 0

# --- Rutas ---
# Empuja la ruta por defecto al cliente (todo el tráfico pasa por la VPN)
push "redirect-gateway def1 bypass-dhcp"
push "dhcp-option DNS 8.8.8.8"
push "dhcp-option DNS 8.8.4.4"

# --- Persistencia y logs ---
keepalive 10 120
persist-key
persist-tun
verb 3

# Archivo de estado — el DashboardController.java lo lee cada 10 s
status /etc/openvpn/openvpn-status.log 10

# PID — el CommandController.java lo usa para start/stop/restart
writepid /etc/openvpn/openvpn.pid

# Cifrado moderno
cipher AES-256-GCM
auth   SHA256

# Permite múltiples clientes con el mismo certificado
duplicate-cn

# Compresión (legacy)
# comp-lzo
