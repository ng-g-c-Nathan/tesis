# ===================================================================
# dnsmasq.conf — DHCP para dispositivos conectados al AP
# Los dispositivos reciben IPs en el rango 10.9.0.100-200
# ===================================================================
interface=wlx90de800944b6
bind-interfaces

# Rango DHCP — da IPs por 12 horas
dhcp-range=10.9.0.100,10.9.0.200,255.255.255.0,12h

# Gateway e IP del servidor
dhcp-option=3,10.9.0.1   # gateway
dhcp-option=6,8.8.8.8    # DNS

# No leer /etc/resolv.conf
no-resolv
server=8.8.8.8
